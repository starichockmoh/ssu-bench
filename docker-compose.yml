version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: ssu-bench-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ssu_bench}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ssu_bench}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssu-bench-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    ports:
      - '${PORT:-3000}:3000'
    command: sh -c "npm run migration:run && npm run start"

volumes:
  postgres_data:
