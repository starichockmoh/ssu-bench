services:
  postgres:
    image: postgres:16
    container_name: ssu-bench-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ssu_bench}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-ssu_bench}']
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: ssu-bench-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    ports:
      - '9094:9094'
    healthcheck:
      test: ['CMD-SHELL', 'bash -ec ''exec 3<>/dev/tcp/127.0.0.1/9092''']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssu-bench-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      KAFKA_BROKERS: kafka:9092
    ports:
      - '${PORT:-3000}:3000'
    command: sh -c "npm run migration:run && npm run start"

  docs:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: ssu-bench-docs
    depends_on:
      backend:
        condition: service_started
    environment:
      SWAGGER_JSON: /app/openapi.yaml
    volumes:
      - ./openapi.yaml:/app/openapi.yaml:ro
    ports:
      - '${DOCS_PORT:-8081}:8080'

volumes:
  postgres_data:
